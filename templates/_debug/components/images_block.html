<div class="images-block"> <!-- TODO: определить источник alt -->
	<img src="{{object.get_image_url}}" alt="{{object.name}}">

	{% with images=images|default:object|getattr:"images"|getattr:"all" %}
		{% if images %}
			<div class="subimages-row">
				{% for image in images %}
					<img src="{{image.get_url}}" alt="{{image.get_image_alt_text|default:object.name}}">
				{% endfor %}
			</div>
		{% endif %}
	{% endwith %}
</div>
